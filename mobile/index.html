<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Codex Web GPT</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0f0f0f; color: #fff; }
    main { min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; }
    .logo { width:72px; height:72px; border-radius:20px; background:#fff; color:#111; display:grid; place-items:center; font-weight:800; font-size:28px; margin-bottom:20px; }
    h1 { margin:0 0 10px; font-size:28px; }
    p { max-width:420px; color:#aaa; line-height:1.5; margin:0 0 28px; }
    button { width:min(100%,360px); border:0; border-radius:14px; padding:16px 20px; background:#fff; color:#111; font-size:16px; font-weight:700; }
    .note { margin-top:16px; font-size:13px; color:#777; }
  </style>
</head>
<body>
  <main>
    <div class="logo">CG</div>
    <h1>Codex Web GPT</h1>
    <p>Bản Android thử nghiệm dựa trên giao diện và luồng của dự án desktop. Đăng nhập ChatGPT bằng trình duyệt hệ thống để tương thích tốt hơn với Google/Passkey.</p>
    <button id="open">Đăng nhập & mở ChatGPT</button>
    <div class="note">Bản thử nghiệm Android • 6.1.3</div>
  </main>
  <script type="module">
    import { Browser } from "@capacitor/browser";
    document.getElementById("open").addEventListener("click", () => {
      Browser.open({ url: "https://chatgpt.com/?temporary-chat=true" });
    });
  </script>
</body>
</html>
